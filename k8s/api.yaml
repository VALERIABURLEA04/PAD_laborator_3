# Each pod is one library branch: the API plus its own MongoDB with a persistent disk.
# kubectl scale statefulset api --replicas=N adds api-3, api-4 ... each with its own database;
# they register in Service Discovery and the sync service copies all books into them.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  clusterIP: None
  # Pods must be resolvable (api-0.api) before they are ready, otherwise the API cannot reach its own database.
  publishNotReadyAddresses: true
  selector: { app: api }
  ports:
    - { name: http, port: 8080 }
    - { name: mongo, port: 27017 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: api
spec:
  serviceName: api
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: api
          image: bookcatalog-api:latest
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: ASPNETCORE_ENVIRONMENT, value: Development }
            - { name: ASPNETCORE_HTTP_PORTS, value: "8080" }
            - { name: Redis__ConnectionString, value: "redis:6379" }
            - { name: Sync__Enabled, value: "true" }
            - { name: Sync__InstanceId, value: "$(POD_NAME)" }
            - { name: MongoDb__ConnectionString, value: "mongodb://$(POD_NAME).api:27017/?directConnection=true" }
            - { name: MongoDb__DatabaseName, value: "bookcatalog-$(POD_NAME)" }
            - { name: Discovery__Url, value: "http://discovery:8080" }
            - { name: Discovery__ServiceName, value: bookcatalog-api }
            - { name: Discovery__HeartbeatSeconds, value: "5" }
            - { name: Discovery__Address, value: "http://$(POD_NAME).api:8080" }
          ports:
            - containerPort: 8080
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 320Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
        - name: mongo
          image: mongo:8.0
          args: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - containerPort: 27017
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
