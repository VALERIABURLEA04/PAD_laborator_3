# The dashboard's Kill button deletes pods through the Kubernetes API, so the gateway
# gets a service account allowed to list and delete pods in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-pods
subjects:
  - kind: ServiceAccount
    name: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-pods
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  # Circuit breakers, metrics and the priority queue are kept in memory: one instance.
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: bookcatalog-gateway:latest
          imagePullPolicy: Never
          env:
            - { name: ASPNETCORE_HTTP_PORTS, value: "8080" }
            - { name: Redis__ConnectionString, value: "redis:6379" }
            - { name: Gateway__Orchestrator, value: kubernetes }
            - { name: Gateway__DiscoveryUrl, value: "http://discovery:8080" }
            - { name: Gateway__ServiceName, value: bookcatalog-api }
            - { name: Gateway__MaxConcurrency, value: "4" }
            - { name: Gateway__CacheTtlSeconds, value: "30" }
            - { name: Gateway__CircuitFailureThreshold, value: "3" }
            - { name: Gateway__CircuitOpenSeconds, value: "15" }
            - { name: Gateway__BalancingMode, value: RoundRobin }
          ports:
            - containerPort: 8080
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /gateway/health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /gateway/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports:
    - port: 8080
