# Seeds api-0's database once; the sync service then copies the books to every other branch.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app: seed }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: mongo:8.0
          command: ["sh", "-c"]
          args:
            - until mongosh --quiet "$MONGO_URL" --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do sleep 3; done;
              mongosh --quiet "$MONGO_URL" /seed/seed.js
          env:
            - { name: MONGO_URL, value: "mongodb://api-0.api:27017/?directConnection=true" }
            - { name: SEED_DATABASE, value: bookcatalog-api-0 }
            - { name: SEED_COUNT, value: "300" }
          resources:
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: script, mountPath: /seed }
      volumes:
        - name: script
          configMap: { name: seed-script }
