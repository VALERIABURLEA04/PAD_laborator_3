upstream bookcatalog_api {
    zone bookcatalog_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api1:8080 resolve max_fails=1 fail_timeout=10s;
    server api2:8080 resolve max_fails=1 fail_timeout=10s;
    server api3:8080 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://bookcatalog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
